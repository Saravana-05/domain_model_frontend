name: Build and Deploy Domain Model Frontend

on:
  push:
    branches:
      - keerthana-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: domain-model-frontend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Docker Username
        run: echo "DOCKERHUB_USER=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            IMAGE=${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            docker pull "$IMAGE"
            docker rm -f domain-model-frontend || true
            docker run -d \
              --name domain-model-frontend \
              -p 3000:80 \
              --restart unless-stopped \
              "$IMAGE"

            docker image prune -f